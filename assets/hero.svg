<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
<title id="t">Harsh Rastogi, data scientist in Darwin</title>
<desc id="d">A map of the Northern Territory at night. The coastline draws in, town lights come on from north to south, and traffic moves along the Stuart Highway. Text: Harsh Rastogi. I turn Territory data into decisions, not just dashboards.</desc>
