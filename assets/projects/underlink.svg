<svg xmlns="http://www.w3.org/2000/svg" width="560" height="296" viewBox="0 0 560 296" role="img" aria-labelledby="t d">
<title id="t">Underlink</title>
<desc id="d">A radio relay chain from fibre to a remote community. When a single-path relay fails, the community loses signal. 18 of 23 radio-chain places depend on such a relay.</desc>
<style>
.ttl{font:600 23px 'Plus Jakarta Sans','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#e6e8ec;letter-spacing:-.01em}
.txt{font:400 15px 'Plus Jakarta Sans','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#9ca0a8}
.stk{font:400 12.5px 'Plus Jakarta Sans','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#63666e}
.lbl{font:400 11.5px 'Plus Jakarta Sans','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#9ca0a8}
.lbl2{font:500 11.5px 'Plus Jakarta Sans','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#e6e8ec}

.down{animation:down 10s ease-in-out infinite}
@keyframes down{0%,50%,86%,100%{opacity:1}56%,80%{opacity:.15}}
.flt{animation:flt 10s ease-in-out infinite}
@keyframes flt{0%,48%,88%,100%{stroke:#35d3ee}52%,82%{stroke:#ef4444}}
.warn{opacity:0;animation:warn 10s ease-in-out infinite}
@keyframes warn{0%,51%,84%,100%{opacity:0}56%,80%{opacity:1}}
.pk{animation:pk 10s linear infinite}
@keyframes pk{0%,50%,84%,100%{opacity:1}53%,81%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}}</style>
<defs><clipPath id="band"><path d="M1,176 V9 a8,8 0 0 1 8,-8 H551 a8,8 0 0 1 8,8 V176 Z"/></clipPath></defs>
<rect x=".5" y=".5" width="559" height="295" rx="8.5" fill="#101112" stroke="#26282c"/>
<g clip-path="url(#band)">
<path d="M140,88 Q224,164 308,84" fill="none" stroke="#3d4046"/>
<text x="224" y="158" text-anchor="middle" class="lbl">alternative path</text>
<path d="M56,112 L140,88 L224,116 L308,84 L392,114" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
<path class="down" d="M392,114 L470,88 L520,112" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
<path id="chain" d="M56,112 L140,88 L224,116 L308,84 L392,114 L470,88 L520,112" fill="none"/>
<rect x="36" y="101" width="40" height="22" rx="4" fill="#101112" stroke="#06b6d4"/><text x="56" y="116" text-anchor="middle" class="lbl2">Fibre</text>
<g transform="translate(140,88)" stroke="#35d3ee" fill="none" stroke-width="1.5" stroke-linecap="round"><path d="M0,-13 L-6,6 M0,-13 L6,6 M-3.8,-2 H3.8"/></g>
<g transform="translate(224,116)" stroke="#35d3ee" fill="none" stroke-width="1.5" stroke-linecap="round"><path d="M0,-13 L-6,6 M0,-13 L6,6 M-3.8,-2 H3.8"/></g>
<g transform="translate(308,84)" stroke="#35d3ee" fill="none" stroke-width="1.5" stroke-linecap="round"><path d="M0,-13 L-6,6 M0,-13 L6,6 M-3.8,-2 H3.8"/></g>
<g transform="translate(392,114)" class="flt" stroke="#35d3ee" fill="none" stroke-width="1.5" stroke-linecap="round"><path d="M0,-13 L-6,6 M0,-13 L6,6 M-3.8,-2 H3.8"/></g>
<g class="down"><g transform="translate(470,88)" stroke="#35d3ee" fill="none" stroke-width="1.5" stroke-linecap="round"><path d="M0,-13 L-6,6 M0,-13 L6,6 M-3.8,-2 H3.8"/></g></g>
<g class="down"><path d="M510,120 V110 L520,102 L530,110 V120 Z" fill="#08361d" stroke="#31d46c" stroke-width="1.4"/></g>
<text x="532" y="138" text-anchor="end" class="lbl">Community</text>
<g class="pk"><circle r="2.6" fill="#e6fbff"><animateMotion dur="5s" begin="0.0s" repeatCount="indefinite"><mpath href="#chain"/></animateMotion></circle></g>
<g class="pk"><circle r="2.6" fill="#e6fbff"><animateMotion dur="5s" begin="2.5s" repeatCount="indefinite"><mpath href="#chain"/></animateMotion></circle></g>
<g class="warn"><text x="392" y="88" text-anchor="middle" class="lbl2">Single-path relay fails</text><text x="532" y="92" text-anchor="end" class="lbl2">No signal</text></g>
<text x="22" y="32" class="lbl">One radio chain from fibre to a remote community, up to six hops</text>
</g>
<line x1="1" y1="176.5" x2="559" y2="176.5" stroke="#26282c"/>
<text x="22" y="210" class="ttl">Underlink</text>
<text x="22" y="238" class="txt">18 of 23 remote places that reach fibre by radio rely</text><text x="22" y="259" class="txt">on a relay with no other licensed path.</text>
<text x="22" y="280" class="stk">Python, graph analysis, Panel. Built for the CDU Code Fair 2026.</text>
</svg>
