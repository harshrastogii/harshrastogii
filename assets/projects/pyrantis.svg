<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330" role="img" aria-labelledby="t d">
<title id="t">PYRANTIS</title>
<desc id="d">PYRANTIS: a grid of 5 km cells burning through the dry season, early fires in amber before 31 July and late fires in red after it. Macro-F1 0.684 on held-out years.</desc>
