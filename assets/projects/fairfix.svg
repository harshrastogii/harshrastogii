<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330" role="img" aria-labelledby="t d">
<title id="t">FairFix NT</title>
<desc id="d">FairFix NT: repair jobs shuffle within urgent, high and routine need bands; a job that tries to cross a band is blocked.</desc>
