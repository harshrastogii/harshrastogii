<text x="22" y="210" class="ttl">Conflux</text>
<text x="22" y="238" class="txt">Two anomaly detectors read the same air and sea data</text><text x="22" y="259" class="txt">every three hours, and still disagree.</text>
<text x="22" y="280" class="stk">scikit-learn, PyTorch, Next.js, Cloudflare Workers.</text>
