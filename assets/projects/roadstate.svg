</g>
<line x1="1" y1="176.5" x2="559" y2="176.5" stroke="#26282c"/>
<text x="22" y="210" class="ttl">RoadState</text>
<text x="22" y="238" class="txt">78% of NT traffic is in Darwin, and 66% of closures</text><text x="22" y="259" class="txt">start in the wet. Access is the problem, not congestion.</text>
<text x="22" y="280" class="stk">Next.js, TypeScript, Visx, Python. Open NT Government data.</text>
