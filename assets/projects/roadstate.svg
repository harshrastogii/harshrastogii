<g clip-path="url(#farc)"><g class="dry"><g class="far"><rect x="60" y="97" width="13" height="5" rx="1.5" fill="#fde9b8"/><rect x="216" y="90" width="13" height="5" rx="1.5" fill="#fde9b8"/><rect x="372" y="97" width="13" height="5" rx="1.5" fill="#fde9b8"/></g></g></g>
<g class="wet"><rect x="306" y="91" width="24" height="10" rx="1.5" fill="#ef4444"/><rect x="420" y="91" width="24" height="10" rx="1.5" fill="#ef4444"/><rect x="500" y="91" width="24" height="10" rx="1.5" fill="#ef4444"/><text x="538" y="126" text-anchor="end" class="lbl2">Closed in the wet</text></g>
