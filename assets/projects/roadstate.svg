<title id="t">RoadState</title>
<desc id="d">RoadState: Darwin traffic keeps flowing while remote roads close as the wet season passes; 78% of traffic is in Darwin and 66% of closures begin in the wet.</desc>
<style>
.code{font:500 11.5px 'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#35d3ee;letter-spacing:.16em}
.ttl{font:700 27px 'Plus Jakarta Sans','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#e6e8ec;letter-spacing:-.01em}
.txt{font:400 15.5px 'Plus Jakarta Sans','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#9ca0a8}
