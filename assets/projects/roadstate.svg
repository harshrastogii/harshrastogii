<svg xmlns="http://www.w3.org/2000/svg" width="560" height="296" viewBox="0 0 560 296" role="img" aria-labelledby="t d">
<title id="t">RoadState</title>
<desc id="d">A year on NT roads: Darwin traffic keeps moving while remote roads close through the wet season.</desc>
<style>
.ttl{font:600 23px 'Plus Jakarta Sans','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#e6e8ec;letter-spacing:-.01em}
.txt{font:400 15px 'Plus Jakarta Sans','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#9ca0a8}
.stk{font:400 12.5px 'Plus Jakarta Sans','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#63666e}
.lbl{font:400 11.5px 'Plus Jakarta Sans','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#9ca0a8}
.lbl2{font:500 11.5px 'Plus Jakarta Sans','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#e6e8ec}

.city{animation:city 2.4s linear infinite}
@keyframes city{from{transform:translateX(-26px)}to{transform:translateX(0)}}
.far{animation:far 14s linear infinite}
@keyframes far{from{transform:translateX(0)}to{transform:translateX(312px)}}
.dry{animation:dry 14s ease-in-out infinite}
@keyframes dry{0%,34%,84%,100%{opacity:1}38%,80%{opacity:0}}
.wet{opacity:0;animation:wet 14s ease-in-out infinite}
@keyframes wet{0%,33%,84%,100%{opacity:0}38%,80%{opacity:1}}
.scrub{animation:scrub 14s linear infinite}
@keyframes scrub{from{transform:translateX(0)}to{transform:translateX(516px)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}}</style>
<defs><clipPath id="band"><path d="M1,176 V9 a8,8 0 0 1 8,-8 H551 a8,8 0 0 1 8,8 V176 Z"/></clipPath></defs>
<rect x=".5" y=".5" width="559" height="295" rx="8.5" fill="#101112" stroke="#26282c"/>
